<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orbit">
<meta name="theme-color" content="#1c1c1f">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Orbit</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#1c1c1f;--panel:#242428;--raised:#2d2d32;--line:#37373d;
  --text:#e4e4e8;--dim:#a0a0a9;--faint:#6e6e77;
  --accent:#9b8cf0;--accent-soft:rgba(155,140,240,.15);--danger:#e06c62;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);min-height:100vh}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:720px;margin:0 auto;padding:0 16px calc(88px + env(safe-area-inset-bottom,0px))}
.muted{color:var(--dim)}.faint{color:var(--faint)}.accent{color:var(--accent)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:6px;height:52px;margin:0 -16px;padding:0 10px 0 16px;background:var(--bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.top .iconbtn:first-child{margin-left:-8px}
.top h1{flex:1;margin:0;font-size:17px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:9px;color:var(--dim)}
.iconbtn:active{background:var(--raised)}
.iconbtn svg{width:22px;height:22px}
.flip svg{transform:scaleX(-1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 15px;border-radius:9px;background:var(--raised);border:1px solid var(--line);font-size:14px;font-weight:550;white-space:nowrap}
.btn:active{filter:brightness(1.15)}
.btn.primary{background:var(--accent);border-color:transparent;color:#17171a}
.btn.danger{color:var(--danger)}
.btn.sm{height:30px;padding:0 11px;font-size:13px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:rgba(28,28,31,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs a{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 5px;font-size:10.5px;color:var(--faint)}
.tabs a.on{color:var(--text)}
.tabs a.on svg{color:var(--accent)}
.tabs svg{width:23px;height:23px}
.badge{position:absolute;top:4px;left:calc(50% + 7px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:10.5px;font-weight:650;display:grid;place-items:center}
@media (min-width:900px){
  body{padding-left:88px}
  .tabs{top:0;right:auto;width:88px;flex-direction:column;justify-content:flex-start;gap:6px;padding-top:calc(24px + env(safe-area-inset-top,0px));border-top:0;border-right:1px solid var(--line)}
  .tabs a{flex:none;padding:10px 0}
  main{padding-bottom:48px}
}

/* list */
.search{display:flex;align-items:center;gap:8px;height:42px;margin:10px 0;padding:0 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--faint)}
.search svg{width:18px;height:18px;flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:16px var(--font)}
.controls{display:flex;align-items:center;gap:6px;margin-bottom:4px;overflow-x:auto;scrollbar-width:none}
.controls::-webkit-scrollbar{display:none}
.chip{flex:none}
.ploc{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:16px;font-weight:550;color:var(--text)}
.ploc svg{width:17px;height:17px;color:var(--accent);flex:none}
.chip{height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--line);color:var(--dim);font-size:13px}
.chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.sort{margin-left:auto;background:none;border:0;color:var(--dim);font:13px var(--font);text-align:right}
.row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
a.row:active,.mt:active{background:var(--panel)}
.row .main,.mt .main{flex:1;min-width:0}
.name{font-weight:600;display:flex;align-items:center;gap:7px}
.sub{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{flex:none;text-align:right;font-size:12px;color:var(--faint)}
.av{width:44px;height:44px;flex:none;border-radius:50%;background:var(--raised) center/cover no-repeat;border:1px solid var(--line);display:grid;place-items:center;color:var(--dim);font-weight:600;font-size:15px}
.stars{color:var(--accent);font-size:12px;letter-spacing:1.5px;white-space:nowrap}
.stars .off{color:var(--line)}
.due{width:7px;height:7px;border-radius:50%;background:var(--danger);flex:none}

/* person */
.hero{display:block;width:calc(100% + 32px);height:340px;margin:0 -16px;position:relative;background:var(--panel) center 28%/cover no-repeat}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(28,28,31,0) 30%,rgba(28,28,31,.55) 65%,var(--bg) 100%)}
.pbody{position:relative;z-index:1;padding-top:14px}
.pbody.over{margin-top:-86px;padding-top:0}
.pname{margin:10px 0 0;font-size:32px;line-height:1.1;font-weight:750;letter-spacing:-.025em}
.pbody.over .pname{margin-top:0}
.prole{color:var(--dim);margin-top:4px;font-size:15px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pill{font-size:12px;padding:3px 9px;border-radius:12px;background:var(--raised);color:var(--dim)}
.pill.type{background:var(--accent-soft);color:var(--accent)}
.ratings{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-top:16px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--line)}
.ratings div{background:var(--panel);padding:9px 12px}
.ratings span.l{display:block;font-size:12px;color:var(--faint);margin-bottom:1px}
.ratings .stars{font-size:15px}
.actions{display:flex;gap:8px;margin-top:14px}
.actions .btn{flex:1}
.stat{margin-top:12px;font-size:13px;color:var(--faint)}
.follow{display:flex;align-items:center;gap:8px;margin-top:14px;padding:10px 10px 10px 13px;border-radius:10px;background:var(--accent-soft)}
.follow.overdue,.follow.today{background:rgba(224,108,98,.13)}
.follow .main{flex:1;min-width:0;font-size:14px}
.follow b{font-weight:600}

.sec{margin-top:28px}
.sec>h2{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px;font-size:13px;font-weight:600;color:var(--faint)}
.sec>h2 a{color:var(--accent);font-weight:500}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.details{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;margin:0;font-size:14px}
.details dt{color:var(--faint)}
.details dd{margin:0;overflow-wrap:anywhere}
.lchips{display:flex;flex-wrap:wrap;gap:6px}
.lchip{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:6px 11px;border-radius:9px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--text)}
.lchip svg{width:15px;height:15px;color:var(--accent);flex:none}
.lchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.pgrid button{aspect-ratio:1;border-radius:6px;background:var(--panel) center/cover no-repeat}
.notes{white-space:pre-wrap;line-height:1.65;overflow-wrap:anywhere}
.wl{color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 3px}
.wl.unres{color:var(--dim);background:none;border-bottom:1px dashed var(--faint);border-radius:0;padding:0}
a.ext{color:var(--accent)}
.mt{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line)}
.mt .date{width:46px;flex:none;text-align:center;font-size:11px;color:var(--faint);line-height:1.2}
.mt .date b{display:block;font-size:20px;font-weight:650;color:var(--text)}
.mt.future .date b{color:var(--accent)}

/* meeting */
.who{display:inline-flex;align-items:center;gap:10px;margin-top:16px;font-weight:600}
.mtitle{margin:14px 0 4px;font-size:28px;line-height:1.15;font-weight:750;letter-spacing:-.02em}
.rate{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:var(--faint)}
.rate .stars{font-size:16px}

/* forms */
.form{padding-bottom:10px}
.f{display:block;margin-top:16px}
.f>span{display:block;margin-bottom:6px;font-size:13px;color:var(--dim)}
.t,.form textarea,.form select{width:100%;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text);font:16px/1.45 var(--font);outline:0;-webkit-appearance:none;appearance:none}
.t:focus,.form textarea:focus,.form select:focus{border-color:var(--accent)}
.form input[type=date],.form input[type=datetime-local]{min-height:44px}
.form textarea{min-height:80px;resize:vertical}
.form textarea.big{min-height:200px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two.solo{grid-template-columns:1fr}
.hide{display:none!important}
.two .f{min-width:0}
.seg{display:flex;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.seg label{flex:1}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:7px;border-radius:7px;text-align:center;font-size:14px;color:var(--dim)}
.seg input:checked+span{background:var(--raised);color:var(--text)}
.star-input{display:flex;gap:6px}
.star-input button{font-size:28px;line-height:1;color:var(--line)}
.star-input button.on{color:var(--accent)}
.thumbs{display:flex;gap:10px;overflow-x:auto;padding:7px 2px 4px}
.thumb{position:relative;width:78px;height:78px;flex:none;border-radius:9px;background:var(--panel) center/cover no-repeat;border:1px solid var(--line);cursor:pointer}
.thumb.cover{outline:2px solid var(--accent);outline-offset:2px}
.thumb .x{position:absolute;top:-7px;right:-7px;width:23px;height:23px;border-radius:50%;background:var(--raised);border:1px solid var(--line);display:grid;place-items:center;font-size:14px;line-height:1}
.addph{width:78px;height:78px;flex:none;border-radius:9px;border:1px dashed var(--faint);display:grid;place-items:center;color:var(--dim);font-size:28px;font-weight:300;cursor:pointer}
.hint{margin-top:6px;font-size:12px;color:var(--faint)}
.form-actions{display:flex;gap:10px;margin-top:26px}
.form-actions .btn{flex:1;height:46px;font-size:15px}

/* calendar */
.cal-head{display:flex;align-items:center;gap:4px;margin:12px 0 8px}
.cal-head h2{flex:1;margin:0;font-size:22px;font-weight:750;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.wd{padding:4px 0;text-align:center;font-size:11px;color:var(--faint)}
.day{display:flex;flex-direction:column;align-items:center;padding:5px 0 6px;border-radius:9px;font-size:15px}
.day .n{width:30px;height:30px;display:grid;place-items:center;border-radius:50%}
.day.out{opacity:.35}
.day.sel{background:var(--raised)}
.day.today .n{background:var(--accent);color:#17171a;font-weight:650}
.dots{display:flex;gap:3px;height:6px;margin-top:2px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.dots i.f{background:none;border:1px solid var(--danger)}

/* settings */
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 13px 0 9px;border-radius:18px;border:1px solid var(--line);font-size:14px;color:var(--dim)}
.sw i{width:18px;height:18px;border-radius:50%;background:var(--c)}
.sw.on{border-color:var(--c);color:var(--text)}
.btns{display:flex;flex-wrap:wrap;gap:8px}

.empty{padding:56px 12px;text-align:center}
.empty h3{margin:0 0 6px;font-size:18px}
.empty p{margin:0 auto 18px;max-width:300px;color:var(--dim)}

/* calendar list view */
.vtoggle{display:flex;margin-top:10px;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.vtoggle button{flex:1;padding:6px;border-radius:7px;font-size:14px;color:var(--dim)}
.vtoggle button.on{background:var(--raised);color:var(--text)}
.lsticky{position:sticky;top:calc(52px + env(safe-area-inset-top,0px));z-index:9;margin:0 -16px;padding:0 16px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.lsticky .search{margin:10px 0 8px}
.mline{display:flex;align-items:baseline;gap:14px;width:100%;margin-top:8px;padding:9px 12px;border-radius:10px;background:var(--accent-soft);font-size:13px;color:var(--dim);text-align:left}
.mline b{color:var(--text);font-size:16px;font-weight:650}
.mline .more{margin-left:auto;color:var(--accent);font-weight:550}
.mhdr{padding:18px 2px 4px;font-size:13px;font-weight:600;color:var(--faint)}
.todaydiv{display:flex;align-items:center;gap:10px;margin-top:18px;font-size:13px;font-weight:600;color:var(--accent)}
.todaydiv::before,.todaydiv::after{content:"";flex:1;height:1px;background:var(--accent);opacity:.45}
#sheet{position:fixed;inset:0;z-index:40;display:none}
#sheet.on{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-width:720px;max-height:82vh;margin:0 auto;overflow-y:auto;padding:8px 18px calc(28px + env(safe-area-inset-bottom,0px));background:var(--panel);border-radius:18px 18px 0 0;border-top:1px solid var(--line)}
.grab{width:38px;height:4px;margin:4px auto 12px;border-radius:2px;background:var(--line)}
.sheet-head{display:flex;align-items:center;gap:8px}
.sheet-head h3{flex:1;margin:0;font-size:20px;font-weight:700}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:14px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sgrid div{padding:10px 12px;background:var(--raised)}
.sgrid b{display:block;font-size:22px;font-weight:700;letter-spacing:-.01em}
.sgrid span{font-size:12px;color:var(--faint)}
.brow{display:grid;grid-template-columns:minmax(0,40%) 1fr auto;align-items:center;gap:10px;width:100%;padding:7px 0;font-size:14px;text-align:left}
.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bb{height:8px;border-radius:4px;background:var(--raised);overflow:hidden}
.bb i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.bn{min-width:24px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
html.lock{overflow:hidden}

/* lightbox + toast */
#lb{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.95);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
#lb .lbb{position:absolute;width:44px;height:44px;border-radius:50%;background:rgba(40,40,44,.8);color:#fff;font-size:24px;display:grid;place-items:center}
#lb .lbx{top:calc(12px + env(safe-area-inset-top,0px));right:12px}
#lb .lbp{left:10px;top:50%}
#lb .lbn{right:10px;top:50%}
#lb .lbc{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:13px;color:#aaa}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:60;transform:translate(-50%,8px);opacity:0;padding:9px 16px;border-radius:20px;background:var(--raised);border:1px solid var(--line);font-size:14px;pointer-events:none;transition:opacity .18s,transform .18s}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<nav class="tabs" id="tabs"></nav>
<main id="view"></main>
<div id="lb" data-act="lb-close"><img alt=""><button class="lbb lbx" data-act="lb-close" aria-label="Close">×</button><button class="lbb lbp" data-act="lb-prev" aria-label="Previous">‹</button><button class="lbb lbn" data-act="lb-next" aria-label="Next">›</button><div class="lbc"></div></div>
<div id="sheet"><div class="sheet-bg" data-act="sheet-close"></div><div class="sheet-panel" id="sheetp"></div></div>
<div id="toast" role="status"></div>
<script>
'use strict';
/* ---------- basics ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : '';
const pad = n => String(n).padStart(2, '0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const localISO = d => `${dkey(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const todayKey = () => dkey(new Date());
const nowISO = () => localISO(new Date());
function parseLocal(s){ const [dp, tp='00:00'] = s.split('T'); const [y,m,d] = dp.split('-').map(Number); const [h,mi] = tp.split(':').map(Number); return new Date(y, m-1, d, h||0, mi||0); }
const dayDiff = (a, b) => Math.round((parseLocal(a.slice(0,10)) - parseLocal(b.slice(0,10))) / 864e5);
function rel(key){
  const d = dayDiff(key, todayKey());
  if (d === 0) return 'today'; if (d === -1) return 'yesterday'; if (d === 1) return 'tomorrow';
  const a = Math.abs(d);
  const s = a < 7 ? a+'d' : a < 60 ? Math.round(a/7)+'w' : a < 730 ? Math.round(a/30)+'mo' : Math.round(a/365)+'y';
  return d < 0 ? s + ' ago' : 'in ' + s;
}
const fmtDay = s => parseLocal(s).toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'});
const fmtLong = s => parseLocal(s).toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric', year:'numeric'});
const fmtTime = s => parseLocal(s).toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'});
const hexA = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${n>>16},${n>>8&255},${n&255},${a})`; };
function roundNow(){ const d = new Date(); d.setMinutes(Math.ceil(d.getMinutes()/15)*15, 0, 0); return localISO(d); }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 1800); }

const sv = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I = {
  back: sv('<path d="M15 18l-6-6 6-6"/>'),
  plus: sv('<path d="M12 5v14M5 12h14"/>'),
  search: sv('<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>'),
  people: sv('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 19.5c.8-3.4 3.4-5.2 6.5-5.2s5.7 1.8 6.5 5.2M16 4.6a3.5 3.5 0 0 1 0 6.8M18.2 14.5c1.8.7 2.9 2.4 3.3 5"/>'),
  cal: sv('<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/>'),
  flag: sv('<path d="M5 21V4M5 4h12l-2.5 4.5L17 13H5"/>'),
  sliders: sv('<path d="M4 7h9M18 7h2M4 17h3M12 17h8"/><circle cx="15.5" cy="7" r="2.3"/><circle cx="9.5" cy="17" r="2.3"/>'),
  edit: sv('<path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/>'),

/* ---------- storage ---------- */
const DB = {
  db: null,
  open(){ return new Promise((res, rej) => { const r = indexedDB.open('orbit', 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('people', {keyPath:'id'}); d.createObjectStore('meetings', {keyPath:'id'}); };
    r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => rej(r.error); }); },
  tx(store, mode, fn){ return new Promise((res, rej) => { const t = this.db.transaction(store, mode); const out = fn(t.objectStore(store)); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('Storage is full')); }); },
  all(s){ return this.tx(s, 'readonly', st => st.getAll()); },
  put(s, o){ return this.tx(s, 'readwrite', st => { st.put(o); }); },
  del(s, id){ return this.tx(s, 'readwrite', st => { st.delete(id); }); },
  clear(s){ return this.tx(s, 'readwrite', st => { st.clear(); }); },
};

const S = { people: [], meetings: [], ui: {q:'', filter:'all', sort:'recent', month:null, day:null, calView:'month', mq:'', myear:'all', mcat:'all'}, draft: null, draftKey: null, lb: null, accent: 'violet' };
const ACCENTS = { violet:'#9b8cf0', steel:'#7fa6c8', sage:'#8db59a', rose:'#cf8ea8' };
function applyAccent(){
  let k = 'violet'; try { k = localStorage.getItem('orbit-accent') || 'violet'; } catch(e) {}
  if (!ACCENTS[k]) k = 'violet'; S.accent = k;
  const r = document.documentElement.style; r.setProperty('--accent', ACCENTS[k]); r.setProperty('--accent-soft', hexA(ACCENTS[k], .15));
}

/* ---------- data helpers ---------- */
const P = id => S.people.find(p => p.id === id);
const M = id => S.meetings.find(m => m.id === id);
const upsert = (arr, o) => { const i = arr.findIndex(x => x.id === o.id); i < 0 ? arr.push(o) : arr[i] = o; };
const meetingsOf = id => S.meetings.filter(m => m.personId === id).sort((a, b) => b.when.localeCompare(a.when));
const lastMet = id => { const n = nowISO(); return meetingsOf(id).find(m => m.when <= n); };
const nextMet = id => { const n = nowISO(); return meetingsOf(id).filter(m => m.when > n).pop(); };
const isPro = p => p.type === 'professional' || p.type === 'both';
const roleCo = p => [p.role, isPro(p) && p.company].filter(Boolean).join(' at ');
const subline = p => [p.location, roleCo(p)].filter(Boolean).join(', ') || p.description || '';
function followStatus(p){ if (!p.followUp) return null; const d = dayDiff(p.followUp, todayKey()); return d < 0 ? 'overdue' : d === 0 ? 'today' : d <= 7 ? 'week' : 'later'; }
const initials = n => (n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
function avatar(p, size){
  const st = size ? `width:${size}px;height:${size}px;font-size:${Math.round(size*.36)}px;` : '';
  const ph = p && p.photos && p.photos[0];
  return ph ? `<span class="av" style="${st}background-image:url('${ph}')"></span>` : `<span class="av" style="${st}">${esc(initials(p && p.name))}</span>`;
}
const stars = n => n ? `<span class="stars">${'★'.repeat(n)}<span class="off">${'★'.repeat(5-n)}</span></span>` : '';
const starInput = (name, v) => `<div class="star-input">${[1,2,3,4,5].map(i => `<button type="button" data-act="star" data-v="${i}" class="${i <= v ? 'on' : ''}" aria-label="${i} of 5">★</button>`).join('')}<input type="hidden" name="${name}" value="${v || 0}"></div>`;

// [[Name]] links and bare URLs inside free text
function rich(t){
  let h = esc(t);
  h = h.replace(/\[\[([^\]]+?)\]\]/g, (m, n) => {
    const p = S.people.find(x => esc(x.name).toLowerCase() === n.trim().toLowerCase());
    return p ? `<a class="wl" href="#/person/${p.id}">${n}</a>` : `<span class="wl unres">${n}</span>`;
  });
  return h.replace(/\bhttps?:\/\/[^\s<]+/g, u => `<a class="ext" href="${u}" target="_blank" rel="noopener">${u}</a>`);
}
const asLink = s => S.people.some(x => x.name.toLowerCase() === s.trim().toLowerCase()) ? `[[${s.trim()}]]` : s;
function backlinks(p){
  const needle = `[[${p.name.toLowerCase()}]]`;
  return {
    people: S.people.filter(x => x.id !== p.id && [x.notes, x.description, x.referredBy && asLink(x.referredBy)].join(' ').toLowerCase().includes(needle)),
    meetings: S.meetings.filter(m => (m.notes || '').toLowerCase().includes(needle)),
  };
}
function linkChip(u){
  const href = /^https?:\/\//i.test(u) ? u : 'https://' + u;
  let label = u;
  try { const x = new URL(href); label = x.hostname.replace(/^www\./, '') + (x.pathname.length > 1 ? x.pathname.replace(/\/$/, '') : ''); } catch(e) {}
  return `<a class="lchip" href="${esc(href)}" target="_blank" rel="noopener">${I.link}<span>${esc(label)}</span></a>`;
}

  <select class="sort" id="sort" aria-label="Sort">${[['recent','Recent'],['name','A to Z'],['rating','Rating']].map(([v, l]) => `<option value="${v}" ${S.ui.sort === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>

function peopleList(){
  if (!S.people.length) return empty('No one here yet', 'Add the people you meet and keep everything about them in one place.', '#/person/new', 'Add a person');
  const q = S.ui.q.trim().toLowerCase();
  let list = S.people.filter(p => S.ui.filter === 'all' || p.type === S.ui.filter || (p.type === 'both' && S.ui.filter !== 'both'));
  if (q) list = list.filter(p => [p.name, p.location, p.company, p.role, p.description, p.notes, p.metHow, p.referredBy, (p.tags || []).join(' ')].join(' ').toLowerCase().includes(q));
  const lm = new Map(list.map(p => { const l = lastMet(p.id); return [p.id, l ? l.when : '']; }));
  const recentKey = p => lm.get(p.id) || (p.createdAt || '').slice(0, 16);
  list.sort(S.ui.sort === 'name' ? (a, b) => a.name.localeCompare(b.name)
    : S.ui.sort === 'rating' ? (a, b) => (b.rating || 0) - (a.rating || 0) || a.name.localeCompare(b.name)
    : (a, b) => recentKey(b).localeCompare(recentKey(a)));
  if (!list.length) return `<p class="muted">No one matches that.</p>`;
  return list.map(p => {
    const l = lm.get(p.id), fs = followStatus(p);
    return `<a class="row" href="#/person/${p.id}">${avatar(p)}<div class="main"><div class="name">${esc(p.name)}${fs === 'overdue' || fs === 'today' ? '<span class="due" title="Follow-up due"></span>' : ''}</div><div class="sub">${esc(subline(p))}</div></div><div class="meta">${l ? rel(l) : ''}<div>${stars(p.rating)}</div></div></a>`;
  }).join('');
}

function vPerson(id){

  ].filter(r => r[1]);
  const followWhen = fs === 'overdue' ? rel(p.followUp) : fs === 'today' ? 'today' : fmtDay(p.followUp || '2000-01-01');
  const stat = (ms.length ? `${ms.length} meeting${ms.length > 1 ? 's' : ''}` : 'No meetings yet') + (lm ? `, last ${rel(lm.when)}` : '') + (nm ? `, next ${fmtDay(nm.when)}` : '');

  return bar(ph.length ? '' : '', `<a class="iconbtn" href="#/person/${id}/edit" aria-label="Edit">${I.edit}</a>`, backBtn)

  + `<div class="pbody ${ph.length ? 'over' : ''}">

      <div class="ratings"><div><span class="l">Connection</span>${stars(p.rating) || '<span class="faint">Not rated</span>'}</div><div><span class="l">Meetings${rated.length ? `, avg of ${rated.length}` : ''}</span>${avg ? stars(avg) : '<span class="faint">None rated</span>'}</div></div>
      ${fs ? `<div class="follow ${fs}"><div class="main"><b>Follow up ${followWhen}</b>${p.followNote ? `<div class="sub">${esc(p.followNote)}</div>` : ''}</div><button class="btn sm" data-act="snooze" data-id="${id}">+1 week</button><button class="btn sm" data-act="done" data-id="${id}">Done</button></div>` : ''}
      <div class="actions"><a class="btn primary" href="#/meeting/new?person=${id}">Log meeting</a><a class="btn" href="#/person/${id}/edit">Edit</a></div>
      <div class="stat">${stat}</div>

  + (details.length ? sec('Details', `<div class="card"><dl class="details">${details.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></div>`) : '')
  + ((p.links || []).length ? sec('Links', `<div class="lchips">${p.links.map(linkChip).join('')}</div>`) : '')

}

function vCal(){
  if (S.ui.calView === 'list') return vCalList();
  const t = todayKey();
  if (!S.ui.month) { const d = new Date(); S.ui.month = new Date(d.getFullYear(), d.getMonth(), 1); }
  if (!S.ui.day) S.ui.day = t;
  const y = S.ui.month.getFullYear(), mo = S.ui.month.getMonth();
  const off = new Date(y, mo, 1).getDay(), dim = new Date(y, mo + 1, 0).getDate(), cells = Math.ceil((off + dim) / 7) * 7;
  const byDay = {}; for (const m of S.meetings) (byDay[m.when.slice(0, 10)] ||= []).push(m);
  const fu = {}; for (const p of S.people) if (p.followUp) (fu[p.followUp] ||= []).push(p);
  let g = ['S','M','T','W','T','F','S'].map(w => `<div class="wd">${w}</div>`).join('');
  for (let i = 0; i < cells; i++) {
    const d = new Date(y, mo, 1 - off + i), k = dkey(d), n = (byDay[k] || []).length, f = (fu[k] || []).length;
    g += `<button class="day ${d.getMonth() !== mo ? 'out' : ''} ${k === t ? 'today' : ''} ${k === S.ui.day ? 'sel' : ''}" data-act="day" data-k="${k}" aria-label="${fmtDay(k)}"><span class="n">${d.getDate()}</span><span class="dots">${'<i></i>'.repeat(Math.min(n, 3))}${f ? '<i class="f"></i>' : ''}</span></button>`;
  }
  const dm = (byDay[S.ui.day] || []).sort((a, b) => a.when.localeCompare(b.when)), df = fu[S.ui.day] || [];
  const n = nowISO(), up = S.meetings.filter(m => m.when > n).sort((a, b) => a.when.localeCompare(b.when)).slice(0, 5);
  return bar('Calendar', `<a class="iconbtn" href="#/meeting/new?date=${S.ui.day}" aria-label="Add meeting">${I.plus}</a>`)
  + calToggle() + `<div class="cal-head"><h2>${S.ui.month.toLocaleDateString(undefined, {month:'long', year:'numeric'})}</h2><button class="btn sm" data-act="cal-today">Today</button><button class="iconbtn" data-act="cal-prev" aria-label="Previous month">${I.back}</button><button class="iconbtn flip" data-act="cal-next" aria-label="Next month">${I.back}</button></div>

function compress(file, max = 1400, q = .82){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('That image could not be read')); };
    img.src = url;
  });
}

async function exportData(){
  const data = JSON.stringify({ app: 'orbit', version: 1, exportedAt: new Date().toISOString(), people: S.people, meetings: S.meetings });
  const name = `orbit-backup-${todayKey()}.json`, file = new File([data], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast('Backup exported');

async function importData(file){

  let d; try { d = JSON.parse(await file.text()); } catch (e) { return toast('That file could not be read'); }
  if (!d || !Array.isArray(d.people) || !Array.isArray(d.meetings)) return toast('That file is not an Orbit backup');
  if (!confirm(`Replace everything on this device with this backup? It has ${d.people.length} people and ${d.meetings.length} meetings.`)) return;
  await DB.clear('people'); await DB.clear('meetings');
  for (const p of d.people) await DB.put('people', p);

  S.people = d.people; S.meetings = d.meetings; await migrate(); toast('Backup restored'); render();
}
